[project]
name = "poker-coach-backend"
version = "0.1.0"
description = "Deterministic domain contracts for a Texas Hold'em strategy coach"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.139.2",
    "pokerkit==0.7.4",
    "pydantic==2.13.4",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]==3.3.4",
]

[dependency-groups]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
