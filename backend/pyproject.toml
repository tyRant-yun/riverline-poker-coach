[project]
name = "poker-coach-backend"
version = "0.1.0"
description = "Deterministic domain contracts for a Texas Hold'em strategy coach"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pokerkit==0.7.4",
    "pydantic==2.13.4",
]

[dependency-groups]
test = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
