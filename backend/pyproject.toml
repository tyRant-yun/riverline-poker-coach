[project]
name = "poker-coach-backend"
version = "0.1.0"
description = "Deterministic domain contracts for a Texas Hold'em strategy coach"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "pokerkit==0.7.4",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.51",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
]
redis = [
    "redis==8.1.0",
]

# migrations/ lives beside poker_coach/ at the backend root; exclude it from
# the editable install (flat-layout would otherwise fail the build).
[tool.setuptools.packages.find]
include = ["poker_coach*"]
exclude = ["migrations*", "tests*"]

[dependency-groups]
test = [
    "fakeredis==2.37.0",
    "pytest==9.1.1",
]
