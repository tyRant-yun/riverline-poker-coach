name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Python 3.13)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: coach
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[postgres,redis]"
          pip install fakeredis==2.37.0 pytest==9.1.1

      - name: Compile check
        working-directory: backend
        run: python -m compileall -q poker_coach tests

      - name: Full test suite with live PostgreSQL regression
        env:
          POKER_COACH_TEST_PG_URL: postgresql://coach:coach@127.0.0.1:5432/coach
          POKER_COACH_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m pytest -v

      - name: Dependency consistency
        working-directory: backend
        run: python -m pip check

  frontend:
    name: Frontend (Next.js build + Playwright E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies (E2E web server)
        working-directory: backend
        run: pip install -e ".[redis]"

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npx playwright test
