name: poker-coach

services:
  web:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      POKER_COACH_DATABASE_URL: postgresql://coach:coach@postgres:5432/coach
      POKER_COACH_REDIS_URL: redis://redis:6379/0
      POKER_COACH_REDIS_WORKER_IN_PROCESS: "0"
      # Teaching agent: the evidence-bound external LLM teacher activates
      # only when a key is present. Values are interpolated from the compose
      # project .env (or the shell environment); absent -> empty string ->
      # the local principle-only teacher stays the fallback (unchanged).
      POKER_COACH_LLM_API_KEY: ${POKER_COACH_LLM_API_KEY:-}
      POKER_COACH_LLM_BASE_URL: ${POKER_COACH_LLM_BASE_URL:-}
      POKER_COACH_LLM_MODEL: ${POKER_COACH_LLM_MODEL:-}
      POKER_COACH_LLM_TIMEOUT_SECONDS: ${POKER_COACH_LLM_TIMEOUT_SECONDS:-180}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "poker_coach.jobs", "--redis-url", "redis://redis:6379/0"]
    environment:
      POKER_COACH_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # Solver worker: consumes solver solve jobs and spawns the isolated
  # poker-coach-sidecar container per job (AGPL engine, never in this repo).
  # Requires the docker socket; on Windows local dev run the worker on the
  # host instead: py -3.13 -m poker_coach.solver --redis-url redis://127.0.0.1:56379/0
  solver-worker:
    build:
      context: ./backend
    command: ["python", "-m", "poker_coach.solver", "--redis-url", "redis://redis:6379/0"]
    environment:
      POKER_COACH_REDIS_URL: redis://redis:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
